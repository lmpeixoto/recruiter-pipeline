[project]
name = "recruiter-pipeline"
version = "0.1.0"
description = "Lê notificações de mensagens do LinkedIn no Gmail, extrai propostas de recruiters com LLM e cria um board no Notion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "notion-client>=2.2",
    "openai>=1.40",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruiter_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]